let currentStudent = "den";
let currentModule = null;
let activeTasks = [];

function selectStudent(stu) {
  currentStudent = stu;
  document.getElementById("stu-den").classList.toggle("active", stu === "den");
  document.getElementById("stu-kirill").classList.toggle("active", stu === "kirill");

  const list = document.getElementById("module-list");
  const mods = STRUCTURE[stu];
  list.innerHTML = mods.map(m => `
    <button class="nav-item" id="nav-${m.id}" onclick="loadModule('${m.id}')">
      <span>${m.title}</span>
    </button>
  `).join("");

  loadModule(mods[0].id);
}

async function loadModule(modId) {
  const mods = STRUCTURE[currentStudent];
  const mod = mods.find(m => m.id === modId);
  currentModule = mod;

  mods.forEach(m => {
    const el = document.getElementById(`nav-${m.id}`);
    if (el) el.classList.toggle("active", m.id === modId);
  });

  // Попытка загрузить реальный JSON из папки data/...
  let payload = null;
  try {
    const res = await fetch(mod.file);
    if (res.ok) payload = await res.json();
  } catch (e) {
    // Используем встроенный резервный набор, если открыто без веб-сервера
  }
  if (!payload) {
    payload = FALLBACK_DB[mod.id] || {
      title: mod.title,
      subtitle: `Файл ${mod.file}`,
      tasks: [],
      items: []
    };
  }

  renderScans(mod.scansFolder);
  renderPayload(payload, mod);
}

function renderScans(folder) {
  const panel = document.getElementById("scans-panel");
  const grid = document.getElementById("scans-grid");
  if (!folder) {
    panel.style.display = "none";
    return;
  }
  panel.style.display = "block";
  grid.innerHTML = [1, 2, 3, 4].map(n => `
    <div class="scan-item" onclick="openLightbox('${folder}/p${n}.jpg')">
      <img src="${folder}/p${n}.jpg" alt="Лист ${n}" loading="lazy">
      <div class="scan-caption">${folder}/p${n}.jpg</div>
    </div>
  `).join("");
}

function openLightbox(src) {
  document.getElementById("lightbox-img").src = src;
  document.getElementById("lightbox").classList.add("open");
}

function normalizeTasks(raw) {
  if (Array.isArray(raw)) return raw;
  if (raw && Array.isArray(raw.tasks)) return raw.tasks;
  if (raw && Array.isArray(raw.questions)) return raw.questions;
  if (raw && Array.isArray(raw.items)) return raw.items;
  return [];
}

function renderPayload(data, mod) {
  document.getElementById("page-title").textContent = data.title || mod.title;
  document.getElementById("page-subtitle").textContent = data.subtitle || mod.file;

  const content = document.getElementById("content-area");
  const pinGrid = document.getElementById("pin-grid");
  const statsPanel = document.getElementById("stats-panel");

  if (mod.type === "theory" || (data.items && !data.tasks)) {
    statsPanel.style.display = "none";
    pinGrid.innerHTML = "";
    const items = data.items || data.sections || normalizeTasks(data);
    content.innerHTML = items.map(item => `
      <div class="card">
        <div class="card-head">
          <span class="card-num">${item.title || item.topic || "Раздел"}</span>
        </div>
        <div class="card-body">${item.body || item.text || item.content || ""}</div>
      </div>
    `).join("");
    if (window.MathJax) MathJax.typesetPromise();
    return;
  }

  statsPanel.style.display = "flex";
  activeTasks = normalizeTasks(data);

  pinGrid.innerHTML = activeTasks.map((t, idx) => {
    const num = t.id || t.num || (idx + 1);
    return `<a href="#task-${num}" class="pin" id="pin-${num}">${num}</a>`;
  }).join("");

  content.innerHTML = activeTasks.map((t, idx) => {
    const num = t.id || t.num || (idx + 1);
    const key = `repet_${currentStudent}_${mod.id}_${num}`;
    const saved = localStorage.getItem(key) || "";
    const topic = t.topic || t.category || (num >= 20 ? "Часть 2" : "Часть 1");
    const questionText = t.text || t.question || t.prompt || "";
    const solText = t.solution || t.explanation || "";
    const ansText = t.answer ?? "";

    return `
      <div class="card" id="task-${num}">
        <div class="card-head">
          <span class="card-num">Задание №${num}</span>
          <span class="card-tag">${topic}</span>
        </div>
        <div class="card-body">${questionText}</div>
        <div class="answer-bar">
          <input class="answer-input" type="text" id="inp-${num}" value="${saved}" placeholder="Введите ответ..." oninput="saveAns('${num}', this.value)">
          <button class="btn primary" onclick="checkTask('${num}')">Проверить</button>
          <button class="btn" onclick="toggleSol('${num}')">Решение</button>
          <span id="badge-${num}"></span>
        </div>
        <div class="solution" id="sol-${num}">
          <div><strong>Решение:</strong> ${solText || "См. разбор с преподавателем."}</div>
          ${ansText !== "" ? `<div style="margin-top:6px;"><strong>Ответ:</strong> ${ansText}</div>` : ""}
        </div>
      </div>
    `;
  }).join("");

  updateStats();
  if (window.MathJax) MathJax.typesetPromise();
}

function norm(val) {
  return String(val || "").trim().replace(/\s+/g, "").replace(/\./g, ",").toLowerCase();
}

function saveAns(num, val) {
  const key = `repet_${currentStudent}_${currentModule.id}_${num}`;
  localStorage.setItem(key, val.trim());
}

function checkTask(num) {
  const t = activeTasks.find((x, i) => String(x.id || x.num || (i + 1)) === String(num));
  if (!t) return;
  const inp = document.getElementById(`inp-${num}`);
  const card = document.getElementById(`task-${num}`);
  const badge = document.getElementById(`badge-${num}`);
  const pin = document.getElementById(`pin-${num}`);

  const userVal = norm(inp.value);
  const rightVals = String(t.answer || "").split("|").map(norm);
  const ok = userVal !== "" && rightVals.includes(userVal);

  card.classList.remove("correct", "wrong");
  card.classList.add(ok ? "correct" : "wrong");

  if (pin) {
    pin.classList.remove("ok", "err");
    pin.classList.add(ok ? "ok" : "err");
  }

  badge.className = "badge " + (ok ? "ok" : "err");
  badge.textContent = ok ? "✓ Верно" : "✗ Ошибка";
  updateStats();
}

function checkAll() {
  activeTasks.forEach((t, i) => checkTask(t.id || t.num || (i + 1)));
}

function updateStats() {
  let okCount = 0;
  activeTasks.forEach((t, i) => {
    const num = t.id || t.num || (i + 1);
    const val = norm(document.getElementById(`inp-${num}`)?.value);
    const rightVals = String(t.answer || "").split("|").map(norm);
    if (val !== "" && rightVals.includes(val)) okCount++;
  });
  const total = activeTasks.length;
  document.getElementById("score-label").textContent = `${okCount} / ${total}`;
  document.getElementById("progress-fill").style.width = total ? `${(okCount / total) * 100}%` : "0%";
}

function toggleSol(num) {
  document.getElementById(`sol-${num}`)?.classList.toggle("open");
}

function resetProgress() {
  activeTasks.forEach((t, i) => {
    const num = t.id || t.num || (i + 1);
    localStorage.removeItem(`repet_${currentStudent}_${currentModule.id}_${num}`);
  });
  loadModule(currentModule.id);
}

function toggleTheme() {
  const root = document.documentElement;
  root.setAttribute("data-theme", root.getAttribute("data-theme") === "dark" ? "light" : "dark");
}

/* Таймер ОГЭ (235 минут = 3 ч 55 мин) */
let timerSec = 235 * 60;
let timerInt = null;
function renderTimer() {
  const h = String(Math.floor(timerSec / 3600)).padStart(2, "0");
  const m = String(Math.floor((timerSec % 3600) / 60)).padStart(2, "0");
  const s = String(timerSec % 60).padStart(2, "0");
  document.getElementById("timer-display").textContent = `${h}:${m}:${s}`;
}
function toggleTimer() {
  const btn = document.getElementById("timer-btn");
  if (timerInt) {
    clearInterval(timerInt);
    timerInt = null;
    btn.textContent = "Старт";
  } else {
    timerInt = setInterval(() => {
      if (timerSec > 0) { timerSec--; renderTimer(); }
    }, 1000);
    btn.textContent = "Пауза";
  }
}
function resetTimer() {
  clearInterval(timerInt);
  timerInt = null;
  timerSec = 235 * 60;
  document.getElementById("timer-btn").textContent = "Старт";
  renderTimer();
}
