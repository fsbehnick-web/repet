<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Подготовка к ОГЭ</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#1c1714;--panel:#271f1a;--line:#40342b;--text:#efe4d6;--dim:#a99886;--acc:#cdb083;--on:#1c1714;--onacc:#1a1a1a;--ok:#4f9d63;--bad:#d46a6a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 Manrope,system-ui,sans-serif;padding:max(14px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom))}
main{max-width:1400px;margin:0 auto}
h1{font-size:21px;margin:6px 0}h2{font-size:17px;margin:18px 0 6px;color:var(--acc)}
.top{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:10px}.g{display:flex;gap:8px}
.wrap{display:block}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.card.done{border-color:var(--ok)}a.card{display:block;color:inherit;text-decoration:none}
.dim{color:var(--dim);font-size:14px}
button,input{font:inherit;color:inherit;border-radius:10px;border:1px solid var(--line);background:var(--panel);padding:9px 12px}
button{cursor:pointer;font-weight:700}button.p{background:var(--acc);color:var(--onacc);border-color:var(--acc)}button.on{outline:2px solid var(--acc)}
input{min-width:0;flex:1}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.msg{margin-top:8px;font-weight:700}.msg.ok{color:var(--ok)}.msg.bad{color:var(--bad)}
.sol{margin-top:10px;padding:10px;border-left:3px solid var(--acc);color:var(--dim);white-space:pre-line}
img.tk,.pg img{max-width:100%;border-radius:10px;border:1px solid var(--line);margin:8px 0;background:#fff}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin:6px 0 2px}.bar i{display:block;height:100%;background:var(--acc);width:0}
.th{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.th button{padding:6px 10px;font-size:13px}
summary{cursor:pointer;font-weight:700}
#board{position:fixed;z-index:20;display:flex;flex-direction:column;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;min-width:300px;min-height:260px;box-shadow:0 8px 30px #0006}
#board.off{display:none}
#bh{display:flex;justify-content:space-between;align-items:center;cursor:move;font-weight:700;user-select:none;touch-action:none}
#bh button{padding:4px 10px;font-size:13px}
#board .tb{display:flex;gap:6px;flex-wrap:wrap;align-items:center}#board .tb button{padding:6px 10px;font-size:14px}
#bw{width:80px;padding:0}.sw{width:28px;height:28px;padding:0;border-radius:50%}
#cvw{flex:1;overflow:auto;border-radius:10px;border:1px dashed var(--line)}
#cv{display:block;width:100%;height:auto;touch-action:none;cursor:crosshair}
.rz{position:absolute;bottom:0;width:20px;height:20px;touch-action:none}
#rzr{right:0;cursor:nwse-resize;border-right:3px solid var(--acc);border-bottom:3px solid var(--acc);border-radius:0 0 12px 0}
#rzl{left:0;cursor:nesw-resize;border-left:3px solid var(--acc);border-bottom:3px solid var(--acc);border-radius:0 0 0 12px}
@media(max-width:999px){#board{display:none;left:0!important;top:0!important;width:100%!important;height:100%!important;border-radius:0;padding:max(10px,env(safe-area-inset-top)) 10px max(10px,env(safe-area-inset-bottom))}#board.open{display:flex}#bh{cursor:default}.rz{display:none}}
</style></head><body><main>
<div class="top"><button id="back" hidden>← Назад</button><b id="ttl"></b><span class="g"><button id="bdb">Доска</button><button id="thb">Темы</button></span></div>
<div id="thp" class="card" hidden></div>
<div class="wrap"><div id="view"></div>
<aside id="board"><div id="rzl" class="rz"></div><div id="bh"><span>Доска</span><button id="bcl">Скрыть</button></div><div class="tb">
<button id="tp" class="on">Ручка</button><button id="te">Ластик</button>
<button class="sw" data-c="auto" title="Основной" style="background:var(--text)"></button><button class="sw" data-c="#e5534b" style="background:#e5534b"></button><button class="sw" data-c="#4f8cff" style="background:#4f8cff"></button>
<input id="bw" type="range" min="1" max="10" value="3"><button id="tu" title="Ctrl+Z">Отменить</button><button id="tc">Очистить</button></div>
<div id="cvw"><canvas id="cv" width="1000" height="1400"></canvas></div><div id="rzr" class="rz"></div></aside></div>
</main><script>
const $=s=>document.querySelector(s);
const h=(t,a={},...k)=>{const e=document.createElement(t);Object.assign(e,a);k.flat().forEach(x=>e.append(x));return e};
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};
const ID=/^[a-z0-9_-]+$/;
const get=async p=>{const r=await fetch('data/'+p+'.json');if(!r.ok)throw 0;return r.json()};
/* ---- темы ---- */
const TH=[['Мокко','#1c1714','#cdb083'],['Терракота','#f2e6d6','#91523a'],['Алый туман','#f4f7f0','#a84d57'],['Лесной крем','#16261a','#a8c2a5'],['Бронзовая ночь','#161d35','#cfaa7a'],['Олива и вино','#47202a','#b7b886'],['Ржавчина','#eee3c8','#8a4a45'],['Мох и слоновая кость','#faf6e4','#5c6838']];
const lum=x=>{const n=parseInt(x.slice(1),16);return((n>>16)*299+((n>>8)&255)*587+(n&255)*114)/1000};
const mix=(a,b,t)=>{const p=x=>[1,3,5].map(i=>parseInt(x.slice(i,i+2),16)),A=p(a),B=p(b);return'#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('')};
function applyTheme(bg,ac,save){
  const d=lum(bg)<128,w=d?'#ffffff':'#000000',tx=d?'#efe4d6':'#3a2f23',s=document.documentElement.style;
  s.setProperty('--bg',bg);s.setProperty('--panel',mix(bg,w,.06));s.setProperty('--line',mix(bg,w,.16));s.setProperty('--text',tx);s.setProperty('--dim',mix(tx,bg,.4));s.setProperty('--acc',ac);s.setProperty('--on',bg);s.setProperty('--onacc',lum(ac)<150?'#ffffff':'#1a1a1a');
  if(save)ls.set('oge-theme',JSON.stringify([bg,ac]));
}
(()=>{let t;try{t=JSON.parse(ls.get('oge-theme'))}catch(e){}
  if(!t){const m=matchMedia('(prefers-color-scheme: dark)').matches;t=m?[TH[0][1],TH[0][2]]:[TH[1][1],TH[1][2]]}
  applyTheme(t[0],t[1],false);
  const bg=h('input',{type:'color',value:t[0]}),ac=h('input',{type:'color',value:t[1]});
  const upd=()=>applyTheme(bg.value,ac.value,true);bg.oninput=ac.oninput=upd;
  $('#thp').append(h('b',{textContent:'Оформление'}),h('div',{className:'th'},TH.map(([n,b,a])=>h('button',{textContent:n,style:`background:${b};color:${lum(b)<128?'#efe4d6':'#3a2f23'};border-color:${a}`,onclick:()=>{bg.value=b;ac.value=a;upd()}}))),
    h('div',{className:'row'},h('label',{className:'dim'},'Фон ',bg),h('label',{className:'dim'},'Акцент ',ac)));
  $('#thb').onclick=()=>$('#thp').hidden=!$('#thp').hidden})();
/* ---- доска ---- */
const B=$('#board'),cv=$('#cv'),cx=cv.getContext('2d'),wide=()=>innerWidth>=1000;
let tool='pen',col='auto',bkey=null,strokes=[],redo=[],cur=null,last;
const pt=e=>{const r=cv.getBoundingClientRect();return[Math.round((e.clientX-r.left)*cv.width/r.width),Math.round((e.clientY-r.top)*cv.height/r.height)]};
const inkOf=c=>c==='auto'?getComputedStyle(document.documentElement).getPropertyValue('--text').trim():c;
function seg(s,a,b){cx.globalCompositeOperation=s.t==='er'?'destination-out':'source-over';cx.strokeStyle=inkOf(s.c);cx.lineWidth=s.w;cx.lineCap=cx.lineJoin='round';cx.beginPath();cx.moveTo(a[0],a[1]);cx.lineTo(b[0],b[1]);cx.stroke()}
function paint(){cx.clearRect(0,0,cv.width,cv.height);strokes.forEach(s=>{const p=s.p;if(p.length<2)return;let a=[p[0],p[1]];seg(s,a,a);for(let i=2;i<p.length;i+=2){const b=[p[i],p[i+1]];seg(s,a,b);a=b}})}
const keep=()=>{if(bkey){if(strokes.length)ls.set(bkey,JSON.stringify(strokes));else ls.del(bkey)}};
function loadBoard(k){bkey='oge-strokes:'+k;redo=[];try{strokes=JSON.parse(ls.get(bkey))||[]}catch(e){strokes=[]}paint()}
cv.onpointerdown=e=>{if(document.activeElement)document.activeElement.blur();e.preventDefault();cv.setPointerCapture(e.pointerId);
  const k=cv.width/(cv.getBoundingClientRect().width||cv.width);last=pt(e);
  cur={t:tool,c:col,w:+$('#bw').value*k*(tool==='er'?4:1),p:[last[0],last[1]]};strokes.push(cur);redo=[];seg(cur,last,last)};
cv.onpointermove=e=>{if(!cur)return;const p=pt(e);cur.p.push(p[0],p[1]);seg(cur,last,p);last=p};
cv.onpointerup=cv.onpointercancel=()=>{if(cur){cur=null;keep()}};
const undo=()=>{if(strokes.length){redo.push(strokes.pop());paint();keep()}};
const redoF=()=>{if(redo.length){strokes.push(redo.pop());paint();keep()}};
$('#tu').onclick=undo;
$('#tc').onclick=()=>{redo=[...strokes].reverse();strokes=[];paint();keep()};
addEventListener('keydown',e=>{if(!(e.ctrlKey||e.metaKey)||e.altKey)return;const z=e.code==='KeyZ',y=e.code==='KeyY',a=document.activeElement;
  if(a&&a.tagName==='INPUT'&&a.type==='text')return;
  if(z&&!e.shiftKey){e.preventDefault();undo()}else if(y||(z&&e.shiftKey)){e.preventDefault();redoF()}});
const setTool=t=>{tool=t;$('#tp').classList.toggle('on',t==='pen');$('#te').classList.toggle('on',t==='er')};
$('#tp').onclick=()=>setTool('pen');$('#te').onclick=()=>setTool('er');
document.querySelectorAll('.sw').forEach(b=>b.onclick=()=>{col=b.dataset.c;setTool('pen')});
/* положение и размер доски */
let G;try{G=JSON.parse(ls.get('oge-geom'))}catch(e){}
if(!G){const w=Math.min(560,Math.round(innerWidth*.42));G={l:innerWidth-w-14,t:14,w,h:innerHeight-28}}
function fit(){const m=$('main').getBoundingClientRect(),on=wide()&&!B.classList.contains('off')&&G.l+G.w/2>innerWidth/2;
  $('#view').style.marginRight=on?Math.max(0,m.right-G.l+12)+'px':''}
function place(){G.w=Math.max(300,Math.min(G.w,innerWidth-8));G.h=Math.max(260,Math.min(G.h,innerHeight-8));
  G.l=Math.max(0,Math.min(G.l,innerWidth-G.w));G.t=Math.max(0,Math.min(G.t,innerHeight-G.h));
  Object.assign(B.style,{left:G.l+'px',top:G.t+'px',width:G.w+'px',height:G.h+'px'});fit()}
function drag(el,fn){el.onpointerdown=e=>{if(e.target.closest('button,input'))return;e.preventDefault();el.setPointerCapture(e.pointerId);
  const x0=e.clientX,y0=e.clientY,g={...G};
  el.onpointermove=ev=>{fn(g,ev.clientX-x0,ev.clientY-y0);place()};
  el.onpointerup=()=>{el.onpointermove=el.onpointerup=null;ls.set('oge-geom',JSON.stringify(G))}}}
drag($('#bh'),(g,dx,dy)=>{G.l=g.l+dx;G.t=g.t+dy});
drag($('#rzr'),(g,dx,dy)=>{G.w=g.w+dx;G.h=g.h+dy});
drag($('#rzl'),(g,dx,dy)=>{const w=Math.max(300,g.w-dx);G.l=g.l+g.w-w;G.w=w;G.h=g.h+dy});
const toggle=()=>{if(wide()){B.classList.toggle('off');ls.set('oge-board-open',B.classList.contains('off')?'0':'1');fit()}else B.classList.toggle('open')};
$('#bdb').onclick=toggle;$('#bcl').onclick=toggle;
if(!wide()||ls.get('oge-board-open')==='0')B.classList.add('off');
addEventListener('resize',place);place();
/* ---- проверка ответа ---- */
const norm=s=>String(s).toLowerCase().replace(/[−–—‒﹣－]/g,'-').replace(/[\s\u00a0()]/g,'').replace(/,/g,'.').replace(/\.$/,'').split(';').sort().join(';');
const same=(a,b)=>{const x=norm(a),y=norm(b);if(x===y)return true;const A=x.split(';'),B=y.split(';');
  return A.length===B.length&&A.every((v,i)=>v!==''&&B[i]!==''&&!isNaN(v)&&!isNaN(B[i])&&Number(v)===Number(B[i]))};
function prog(key,list,box){const d=list.filter(t=>ls.get(key+':'+t.n)==='1').length;
  box.replaceChildren(h('span',{className:'dim',textContent:`Решено с проверкой: ${d} из ${list.length}`}),h('div',{className:'bar'},h('i',{style:`width:${list.length?100*d/list.length:0}%`})))}
function task(key,t,refresh){
  const c=h('div',{className:'card'+(ls.get(key+':'+t.n)==='1'?' done':'')});
  c.append(h('b',{},t.n?t.n+'. ':''),t.text||'');
  if(t.img)c.append(h('img',{src:t.img,className:'tk'}));
  const row=h('div',{className:'row'}),msg=h('div',{className:'msg'}),sol=h('div',{className:'sol',hidden:true,textContent:t.sol||'Решение пока не добавлено.'});
  if(t.ans){const sv=key+':v:'+t.n,inp=h('input',{placeholder:'Ваш ответ',value:ls.get(sv)||''}),go=h('button',{className:'p',textContent:'Проверить'});
    if(c.classList.contains('done')){msg.className='msg ok';msg.textContent='Верно!'}
    inp.oninput=()=>ls.set(sv,inp.value);
    const chk=()=>{if(!inp.value.trim())return;
      if(t.ans.some(a=>same(a,inp.value))){msg.className='msg ok';msg.textContent='Верно!';ls.set(key+':'+t.n,'1');c.classList.add('done');refresh()}
      else{msg.className='msg bad';msg.textContent='Неверно. Попробуйте ещё раз.';inp.select()}};
    go.onclick=chk;inp.onkeydown=e=>{if(e.key==='Enter')chk()};row.append(inp,go)}
  if(t.sol||t.ans)row.append(h('button',{textContent:'Решение',onclick:()=>{sol.hidden=!sol.hidden}}));
  c.append(row,msg,sol);return c}
/* ---- экраны ---- */
function material(p,m,d){
  const key='oge:'+p+':'+m,all=d.sections.flatMap(s=>s.tasks||[]),chk=all.filter(t=>t.ans),box=h('div'),v=h('div');
  const refresh=()=>prog(key,chk,box);v.append(h('h1',{textContent:d.title}));
  if(d.kind==='tasks'&&chk.length){v.append(box);refresh()}
  if(d.pages)v.append(h('details',{className:'card pg'},h('summary',{textContent:'КИМ: страницы варианта'}),d.pages.map(src=>{const i=h('img',{src,loading:'lazy'});i.onerror=()=>i.replaceWith(h('p',{className:'dim',textContent:'Нет файла '+src}));return i})));
  d.sections.forEach(s=>{v.append(h('h2',{textContent:s.t}));
    if(d.kind==='tasks')s.tasks.forEach(t=>v.append(task(key,t,refresh)));
    else v.append(h('div',{className:'card'},h('ul',{},s.l.map(x=>h('li',{textContent:x})))))});
  return v}
async function route(){
  const [p,m]=location.hash.slice(1).split('/'),v=$('#view');$('#back').hidden=!p;
  loadBoard((p||'home')+'/'+(m||'list'));
  try{
    if(!p){$('#ttl').textContent='Подготовка к ОГЭ';const d=await get('index');
      v.replaceChildren(h('h1',{textContent:'Кто занимается?'}),...d.people.map(x=>h('a',{className:'card',href:'#'+x.id,textContent:x.t})))}
    else if(!m){if(!ID.test(p))throw 0;const d=await get(p+'/index');$('#ttl').textContent=d.title;
      v.replaceChildren(...d.items.map(x=>h('a',{className:'card',href:'#'+p+'/'+x.id},h('b',{textContent:x.t}),h('div',{className:'dim',textContent:x.sub||''}))))}
    else{if(!ID.test(p)||!ID.test(m))throw 0;const d=await get(p+'/'+m);$('#ttl').textContent='';v.replaceChildren(material(p,m,d));scrollTo(0,0)}
  }catch(e){v.replaceChildren(h('p',{textContent:'Не удалось открыть страницу.'}))}}
$('#back').onclick=()=>{const a=location.hash.slice(1).split('/');location.hash=a.length>1?'#'+a[0]:''};
addEventListener('hashchange',route);route();
</script></body></html>
